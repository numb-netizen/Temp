name: Test Android WebView on emulator
on:
  push:
    paths: ['android/**', '.github/workflows/android-live-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-webview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test live site in Android WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: cd android && ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Report Android test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('android/app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True)
          for path in files:
              for failure in ET.parse(path).iter('failure'):
                  message = (failure.get('message', '') or failure.text or 'Android test failed').replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error title=Android test::' + message[:3000])
          PY
