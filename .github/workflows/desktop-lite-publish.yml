name: Publish tested lightweight desktop beta
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build lightweight desktop apps run ID
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify build provenance and publish artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          gh run view "$BUILD_RUN" --json workflowName,status,conclusion,headSha,headBranch,event > "$RUNNER_TEMP/run.json"
          jq -e --arg branch "$GITHUB_REF_NAME" '.workflowName == "Build lightweight desktop apps" and .status == "completed" and .conclusion == "success" and .headBranch == $branch and .event == "push"' "$RUNNER_TEMP/run.json" >/dev/null
          build_sha=$(jq -r .headSha "$RUNNER_TEMP/run.json")
          # No application, website or build-workflow changes since the tested build.
          for p in site desktop-lite .github/workflows/desktop-lite.yml; do
            test "$(git rev-parse "$build_sha:$p")" = "$(git rev-parse "$GITHUB_SHA:$p")"
          done
          mkdir release
          gh run download "$BUILD_RUN" -n lite-linux -D release
          gh run download "$BUILD_RUN" -n lite-windows -D release
          cd release
          test -f HSC-2027-Lite-0.2.1-beta-win-x64.zip
          test -f HSC-2027-Lite-0.2.1-beta-linux.deb
          sha256sum *.zip *.deb > SHA256SUMS.txt
          cat > notes.txt <<'NOTES'
          # HSC 2027 Lite beta

          Windows 10/11 x64: ZIP পুরোপুরি extract করে HSC-2027-Lite.exe চালান। Microsoft Edge WebView2 Runtime ও .NET 10 Desktop Runtime (x64) প্রয়োজন; না থাকলে Microsoft থেকে আলাদাভাবে ইনস্টল করতে হবে। প্রথমবার runtime ডাউনলোডের জন্য ইন্টারনেট ও অতিরিক্ত স্থান লাগবে। এটি unsigned beta, SmartScreen সতর্ক করতে পারে।

          Linux: Ubuntu/Debian-ভিত্তিক সিস্টেমে .deb ইনস্টল করুন (যেমন `sudo apt install ./HSC-2027-Lite-0.2.1-beta-linux.deb`)। Python 3, GTK ও WebKitGTK 4.1 প্যাকেজ ইনস্টল হতে পারে; অন্য Linux distribution-এ এই .deb সরাসরি চলবে না।

          প্যাকেজে থাকা পৃষ্ঠা ও ট্র্যাকার অফলাইনে চলে; ভিডিও, WhatsApp, বাইরের লিংক ও ফন্টের জন্য ইন্টারনেট লাগে। সাইটের নতুন তথ্য পেতে নতুন অ্যাপ সংস্করণ লাগবে। Lite অ্যাপের ট্র্যাকার পুরোনো Electron অ্যাপ, ওয়েব ও অন্য ডিভাইস থেকে আলাদা; স্বয়ংক্রিয় স্থানান্তর নেই। পুরোনো অ্যাপের তথ্য রাখতে সেটি আনইনস্টল করবেন না। স্বয়ংক্রিয় আপডেট নেই। স্থানীয় পৃষ্ঠার জন্য অ্যাপ শুধু কম্পিউটারের loopback-এ ছোট সার্ভার ব্যবহার করে।
          NOTES
          gh release create desktop-lite-v0.2.1-beta *.zip *.deb SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title 'HSC 2027 Lite 0.2.1 beta' --notes-file notes.txt
