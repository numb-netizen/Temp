name: Build Android app

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      publish_beta:
        description: Publish this debug build as the Android 1.2 beta prerelease
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK components
        run: |
          echo "SDK: ${ANDROID_HOME:-unset}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          else
            echo "Android SDK command-line tools not available" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Test and build debug APK and instrumentation tests
        run: |
          if ! ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest > "$RUNNER_TEMP/build.log" 2>&1; then
            python3 -c 'import os; p=os.path.join(os.environ["RUNNER_TEMP"],"build.log"); s="".join(open(p).readlines()[-100:]); print("::error::"+s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
            exit 1
          fi
          tail -n 20 "$RUNNER_TEMP/build.log"
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HSC-2027-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30


  publish_beta:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_beta
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: HSC-2027-debug-APK
          path: apk

      - name: Publish Android 1.2 beta APK
        if: github.event_name == 'workflow_dispatch' && inputs.publish_beta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          apk="HSC-2027-v1.2-beta-debug.apk"
          cp apk/app-debug.apk "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='bd.edu.hsc2027' versionCode='3' versionName='1.2'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee signature.txt
          grep -F 'CN=Android Debug' signature.txt
          sha256sum "$apk" > SHA256SUMS.txt
          cat > release-notes.txt <<'NOTES'
          # HSC 2027 Android 1.2 beta

          অ্যাপের ভেতরে অ্যাপ ডাউনলোড লিংক আর দেখানো হয় না। সাধারণ ব্রাউজার ও অন্যান্য Android WebView-এ ওয়েবসাইটের লিংক আগের মতোই থাকে। অ্যাপ চালাতে Android 6.0 বা নতুন সংস্করণ ও ইন্টারনেট প্রয়োজন।

          **এটি পরীক্ষামূলক debug APK, Play Store বা স্থায়ীভাবে signed release নয়।** নতুন build-এর debug key আগের APK-এর key থেকে আলাদা হতে পারে; সেক্ষেত্রে সেটির ওপর সরাসরি আপডেট হবে না। আগের অ্যাপ সরালে অ্যাপের স্থানীয় অধ্যায় ট্র্যাকার তথ্য মুছে যাবে। স্থায়ী release signing key এখনও সেট করা হয়নি।

          SHA256SUMS.txt দিয়ে ডাউনলোডের integrity যাচাই করা যায়।
          NOTES
          gh release create android-v1.2-beta "$apk" SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title 'HSC 2027 Android 1.2 beta (debug)' --notes-file release-notes.txt
      - name: Set up ORAS for beta package
        if: github.event_name == 'workflow_dispatch' && inputs.publish_beta
        uses: oras-project/setup-oras@v1
        with:
          version: 1.2.2
      - name: Publish same APK to GitHub Packages
        if: github.event_name == 'workflow_dispatch' && inputs.publish_beta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          ref="ghcr.io/$owner/hsc-2027-android:android-v1.2-beta"
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if oras manifest fetch "$ref" >/dev/null 2>&1; then
            echo 'Package tag already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          oras push "$ref" --artifact-type application/vnd.android.package-archive \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation 'org.opencontainers.image.description=HSC 2027 Android 1.2 beta debug APK' \
            'HSC-2027-v1.2-beta-debug.apk:application/vnd.android.package-archive' 'SHA256SUMS.txt:text/plain'
          oras manifest fetch "$ref" >/dev/null
