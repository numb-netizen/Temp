name: Build Android app

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK components
        run: |
          echo "SDK: ${ANDROID_HOME:-unset}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          else
            echo "Android SDK command-line tools not available" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Test and build debug APK and instrumentation tests
        run: |
          if ! ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest > "$RUNNER_TEMP/build.log" 2>&1; then
            python3 -c 'import os; p=os.path.join(os.environ["RUNNER_TEMP"],"build.log"); s="".join(open(p).readlines()[-100:]); print("::error::"+s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
            exit 1
          fi
          tail -n 20 "$RUNNER_TEMP/build.log"
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HSC-2027-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
