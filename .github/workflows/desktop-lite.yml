name: Build lightweight desktop apps
on:
  push:
    paths: ['desktop-lite/**', 'site/**', 'tests/desktop_lite*', '.github/workflows/desktop-lite.yml']
  workflow_dispatch:
    inputs:
      publish_beta:
        description: Publish tested Lite beta release
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb
      - name: Test navigation policy
        run: python3 -m unittest discover -s tests -p 'desktop_lite*.py' -v
      - name: Package and install
        run: |
          desktop-lite/linux/build-deb.sh
          sudo apt-get install -y ./desktop-lite/dist/*.deb
      - name: Test packaged offline navigation, tracker and theme
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
        run: xvfb-run -a /usr/bin/hsc-2027-lite --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: lite-linux
          path: desktop-lite/dist/*.deb
          if-no-files-found: error
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish standalone executable
        shell: pwsh
        run: |
          dotnet publish desktop-lite/windows/HscLite.csproj -c Release -r win-x64 --self-contained true -o desktop-lite/dist/windows -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item site desktop-lite/dist/windows/site -Recurse
      - name: Test bundled offline navigation, tracker and theme
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'desktop-lite/dist/windows/HSC-2027-Lite.exe' -ArgumentList '--smoke' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Lite smoke test failed: $($p.ExitCode)" }
      - name: Package Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path desktop-lite/dist/windows/* -DestinationPath desktop-lite/dist/HSC-2027-Lite-0.2.0-beta-win-x64.zip
          Get-Item desktop-lite/dist/*.zip | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: lite-windows
          path: desktop-lite/dist/*.zip
          if-no-files-found: error
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_beta
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lite-*
          path: release
          merge-multiple: true
      - name: Publish release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release
          test -f HSC-2027-Lite-0.2.0-beta-win-x64.zip
          test -f HSC-2027-Lite-0.2.0-beta-linux.deb
          sha256sum *.zip *.deb > SHA256SUMS.txt
          cat > notes.txt <<'NOTES'
          # HSC 2027 Lite beta

          Windows 10/11 x64: ZIP পুরোপুরি extract করে HSC-2027-Lite.exe চালান। Microsoft Edge WebView2 Runtime প্রয়োজন; না থাকলে Microsoft থেকে আলাদাভাবে ইনস্টল করতে হবে। এটি unsigned beta, SmartScreen সতর্ক করতে পারে।

          Linux: Ubuntu/Debian-ভিত্তিক সিস্টেমে .deb ইনস্টল করুন (যেমন `sudo apt install ./HSC-2027-Lite-0.2.0-beta-linux.deb`)। Python 3, GTK ও WebKitGTK 4.1 প্যাকেজ ইনস্টল হতে পারে; অন্য Linux distribution-এ এই .deb সরাসরি চলবে না।

          প্যাকেজে থাকা পৃষ্ঠা ও ট্র্যাকার অফলাইনে চলে; ভিডিও, WhatsApp, বাইরের লিংক ও ফন্টের জন্য ইন্টারনেট লাগে। সাইটের নতুন তথ্য পেতে নতুন অ্যাপ সংস্করণ লাগবে। Lite অ্যাপের ট্র্যাকার পুরোনো Electron অ্যাপ, ওয়েব ও অন্য ডিভাইস থেকে আলাদা; স্বয়ংক্রিয় স্থানান্তর নেই। পুরোনো অ্যাপের তথ্য রাখতে সেটি আনইনস্টল করবেন না। স্বয়ংক্রিয় আপডেট নেই। স্থানীয় পৃষ্ঠার জন্য অ্যাপ শুধু কম্পিউটারের loopback-এ ছোট সার্ভার ব্যবহার করে।
          NOTES
          gh release create desktop-lite-v0.2.0-beta *.zip *.deb SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title 'HSC 2027 Lite 0.2.0 beta' --notes-file notes.txt
